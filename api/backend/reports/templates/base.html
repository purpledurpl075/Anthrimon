<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { margin: 26mm 14mm 20mm 14mm; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1e293b;
    font-size: 11px;
    margin: 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 2px solid #1e293b;
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 28px; width: auto; }
  .brand-name { font-size: 14px; font-weight: 700; color: #1e293b; }
  .meta { text-align: right; color: #64748b; font-size: 10px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; color: #1e293b; }
  .subtitle { color: #64748b; margin: 0 0 20px 0; }
  h2 { font-size: 15px; margin: 24px 0 8px 0; color: #1e293b; border-top: 1px solid #e2e8f0; padding-top: 16px; }
  h2:first-of-type { border-top: none; padding-top: 0; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  th {
    text-align: left; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.04em; color: #64748b; font-weight: 600;
    padding: 6px 10px; border-bottom: 1px solid #e2e8f0; background: #f8fafc;
  }
  td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; }
  tr:nth-child(even) td { background: #fafbfc; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: "SF Mono", Consolas, monospace; font-size: 10px; }
  .muted { color: #94a3b8; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 9px; font-weight: 600;
  }
  .badge-good { background: #dcfce7; color: #15803d; }
  .badge-warn { background: #fef3c7; color: #b45309; }
  .badge-bad  { background: #fee2e2; color: #b91c1c; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      {% if logo_data_uri %}<img src="{{ logo_data_uri }}">{% endif %}
      <span class="brand-name">{{ company_name }}</span>
    </div>
    <div class="meta">
      Generated {{ generated_at }}<br>
      {{ tenant_name }}
      {% if generated_by %}<br>Generated by {{ generated_by }}{% endif %}
    </div>
  </div>
  <h1>{{ title }}</h1>
  <p class="subtitle">{{ subtitle }}</p>
  {% block content %}{% endblock %}
</body>
</html>
